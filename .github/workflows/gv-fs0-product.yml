name: GV-ALPHA0 Historical Receipt Integrity

on:
  pull_request:
    paths:
      - "release/gv-alpha0/**"
      - "tests/gv_fs0_product/test_gv_alpha0_historical_receipt.py"
      - ".github/workflows/gv-fs0-product.yml"
  push:
    paths:
      - "release/gv-alpha0/**"
      - "tests/gv_fs0_product/test_gv_alpha0_historical_receipt.py"
      - ".github/workflows/gv-fs0-product.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-receipt:
    name: Frozen receipt integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify historical receipt and hard-cut root absence
        run: python -m pytest -q tests/gv_fs0_product/test_gv_alpha0_historical_receipt.py

      - name: Require verification to leave tracked bytes unchanged
        run: git diff --exit-code
