name: GV-FS0 Product

on:
  pull_request:
    paths:
      - "core/gv_alpha0_ship_runtime.py"
      - "scripts/build_gv_alpha0_release.py"
      - "scripts/smoke_gv_alpha0_release.py"
      - "release/gv-alpha0/**"
      - "requirements-release.txt"
      - "core/gv_fs0_book.py"
      - "core/gv_fs0_bundle.py"
      - "core/gv_fs0_canonical.py"
      - "core/gv_fs0_certify.py"
      - "core/gv_fs0_current_decision.py"
      - "core/gv_fs0_publish.py"
      - "core/gv_e0a_operable.py"
      - "core/gv_e0b_dv1_contradiction.py"
      - "core/gv_v2_b0_real_block_only.py"
      - "core/gv_v2_b0b_official_source_intake.py"
      - "core/gv_v2_alpha0_case_close.py"
      - "core/gv_v2_alpha0_source_family_two.py"
      - "data/gv_v2_b0/**"
      - "data/gv_v2_b0b/**"
      - "data/gv_v2_alpha0/**"
      - "data/gv_fs0/gv_fs0_certified_bundle.json"
      - "data/gv_fs0/gv_fs0_current_decision.json"
      - "data/gv_e0b/**"
      - "docs/architecture/godview_e0/**"
      - "scripts/publish_gv_e0a_current.py"
      - "views/gv_fs0_portfolio_adapter.py"
      - "views/gv_alpha0_case_workspace.py"
      - "views/page_registry.py"
      - "dashboard.py"
      - "alpha_app.py"
      - "launch_alpha.py"
      - "requirements-alpha.txt"
      - "tests/gv_fs0_product/**"
      - "tests/test_gv_fs0_*.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - ".github/workflows/gv-fs0-product.yml"
  push:
    paths:
      - "core/gv_alpha0_ship_runtime.py"
      - "scripts/build_gv_alpha0_release.py"
      - "scripts/smoke_gv_alpha0_release.py"
      - "release/gv-alpha0/**"
      - "requirements-release.txt"
      - "core/gv_fs0_book.py"
      - "core/gv_fs0_bundle.py"
      - "core/gv_fs0_canonical.py"
      - "core/gv_fs0_certify.py"
      - "core/gv_fs0_current_decision.py"
      - "core/gv_fs0_publish.py"
      - "core/gv_e0a_operable.py"
      - "core/gv_e0b_dv1_contradiction.py"
      - "core/gv_v2_b0_real_block_only.py"
      - "core/gv_v2_b0b_official_source_intake.py"
      - "core/gv_v2_alpha0_case_close.py"
      - "core/gv_v2_alpha0_source_family_two.py"
      - "data/gv_v2_b0/**"
      - "data/gv_v2_b0b/**"
      - "data/gv_v2_alpha0/**"
      - "data/gv_fs0/gv_fs0_certified_bundle.json"
      - "data/gv_fs0/gv_fs0_current_decision.json"
      - "data/gv_e0b/**"
      - "docs/architecture/godview_e0/**"
      - "scripts/publish_gv_e0a_current.py"
      - "views/gv_fs0_portfolio_adapter.py"
      - "views/gv_alpha0_case_workspace.py"
      - "views/page_registry.py"
      - "dashboard.py"
      - "alpha_app.py"
      - "launch_alpha.py"
      - "requirements-alpha.txt"
      - "tests/gv_fs0_product/**"
      - "tests/test_gv_fs0_*.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - ".github/workflows/gv-fs0-product.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-proof:
    name: Product proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install product test dependencies
        # filelock is a direct pin in requirements.txt / pyproject.toml (dashboard import).
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt

      - name: Emit environment custody evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_text(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          freeze = subprocess.check_output(
              [sys.executable, "-m", "pip", "freeze"], text=True
          )
          filelock_ver = "ABSENT"
          for line in freeze.splitlines():
              if line.lower().startswith("filelock=="):
                  filelock_ver = line.split("==", 1)[1].strip()
                  break

          prereg = Path("docs/phase_brief/gv-e0b-dv1-contradiction-brief.md")
          manifest = Path("docs/candidate_manifests/gv_e0b_dv1_c1_candidate.json")
          record = {
              "runner_os": platform.platform(),
              "runner_image_name": os.environ.get("ImageOS", "unknown"),
              "runner_image_version": os.environ.get("ImageVersion", "unknown"),
              "python_version": sys.version.replace("\n", " "),
              "pip_version": subprocess.check_output(
                  [sys.executable, "-m", "pip", "--version"], text=True
              ).strip(),
              "pip_freeze": freeze.splitlines(),
              "filelock_version": filelock_ver,
              "candidate_commit": git_text("rev-parse", "HEAD"),
              "candidate_tree": git_text("rev-parse", "HEAD^{tree}"),
              "preregistration_sha256": (
                  sha256_file(prereg) if prereg.is_file() else None
              ),
              "candidate_manifest_sha256": (
                  sha256_file(manifest) if manifest.is_file() else None
              ),
          }
          custody_path = (
              Path(os.environ["RUNNER_TEMP"])
              / "gv-fs0-environment-custody.json"
          )
          custody_path.write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps({k: record[k] for k in (
              "runner_os", "runner_image_name", "runner_image_version",
              "python_version", "filelock_version", "candidate_commit",
              "candidate_tree"
          )}, indent=2))
          PY

      - name: Upload environment custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: gv-fs0-environment-custody-${{ runner.os }}
          path: ${{ runner.temp }}/gv-fs0-environment-custody.json
          if-no-files-found: error
          retention-days: 30

      - name: Run product suite, frozen protocol, and E0A dashboard AppTests
        shell: bash
        run: >-
          python -c "import glob, pytest, sys;
          sys.exit(pytest.main([
            '-q',
            'tests/gv_fs0_product',
            *glob.glob('tests/test_gv_fs0_*.py'),
            'tests/test_dash_1_page_registry_shell.py::test_dash_1_default_portfolio_route_renders_current_decision',
          ]))"

      - name: Build deterministic GV-ALPHA0 release
        shell: bash
        run: python scripts/build_gv_alpha0_release.py --output-dir dist

      - name: Smoke extracted GV-ALPHA0 release
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          archives = list(Path("dist").glob("gv-alpha0-paper-decision-*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"expected one release archive, found {len(archives)}")
          with tempfile.TemporaryDirectory(prefix="gv-alpha0-ci-smoke-") as tmp:
              extract_root = Path(tmp)
              with zipfile.ZipFile(archives[0]) as archive:
                  archive.extractall(extract_root)
              product_roots = [p for p in extract_root.iterdir() if p.is_dir()]
              if len(product_roots) != 1:
                  raise SystemExit("release archive must contain one product root")
              product_root = product_roots[0]
              venv_root = extract_root / "release-venv"
              subprocess.run(
                  [sys.executable, "-m", "venv", str(venv_root)], check=True
              )
              venv_python = (
                  venv_root / "Scripts" / "python.exe"
                  if sys.platform == "win32"
                  else venv_root / "bin" / "python"
              )
              subprocess.run(
                  [
                      str(venv_python),
                      "-m",
                      "pip",
                      "install",
                      "--disable-pip-version-check",
                      "-r",
                      str(product_root / "requirements-release.txt"),
                  ],
                  check=True,
              )
              subprocess.run(
                  [
                      str(venv_python),
                      "-c",
                      "import streamlit, jsonschema, referencing",
                  ],
                  cwd=product_root,
                  check=True,
              )
              completed = subprocess.run(
                  [str(venv_python), "scripts/smoke_gv_alpha0_release.py"],
                  cwd=product_root,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              record = json.loads(completed.stdout.strip().splitlines()[-1])
              if record.get("status") != "PASS":
                  raise SystemExit("fresh release smoke did not pass")
              print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Upload GV-ALPHA0 release candidate
        uses: actions/upload-artifact@v4
        with:
          name: gv-alpha0-release-${{ runner.os }}
          path: dist/gv-alpha0-paper-decision-*
          if-no-files-found: error
          retention-days: 30

      - name: Build F1C substrate + Alpha0 current authority parity artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from core.gv_e0a_operable import (
              build_e0a_certified_result,
              build_e0a_research_decision,
          )
          from core.gv_fs0_bundle import certified_bundle_bytes
          from core.gv_fs0_canonical import sha256_bytes
          from core.gv_fs0_current_decision import (
              certified_decision_result_bytes,
              parse_current_decision_bytes,
          )
          from core.gv_fs0_publish import build_default_certified_bundle

          # E0A rebuild is historical substrate only (distinct from Alpha current).
          EXPECTED_RESEARCH_DECISION_HASH = (
              "b4694a69bd1bc35a0d97a839ad47b66b517da1bd0f4abccd56bacca22d9e8e38"
          )
          EXPECTED_E0A_RESULT_HASH = (
              "627c136926ecf947f2ea00f24de85291d44ef5594016f022fac7f2217093d6e6"
          )
          EXPECTED_E0A_CURRENT_FILE_SHA256 = (
              "7ba9c7c48dfc89ceae2a5a88aba8bfebbe6d5032272b0d254f4139478699b5c9"
          )
          EXPECTED_E0A_CURRENT_BYTE_LENGTH = 23696
          EXPECTED_E0A_RATIONALE_REF = f"E0A:RD:{EXPECTED_RESEARCH_DECISION_HASH}"

          # Tracked product authority after GV-ALPHA0-CLOSE publish (Commit B).
          EXPECTED_ALPHA0_DECISION_ID = "DECISION_V2_ALPHA0_CLOSE_MU_G_SUPPLY_1"
          EXPECTED_ALPHA0_CASE_CLAIM_HASH = (
              "f2d6a71b139683292af8c71950c3478557b3e21826990699b2809ba24a040d82"
          )
          EXPECTED_ALPHA0_RATIONALE_REF = (
              f"ALPHA0:CLOSE:CLM:{EXPECTED_ALPHA0_CASE_CLAIM_HASH}"
          )
          EXPECTED_ALPHA0_RESULT_HASH = (
              "889cc831fe405e5aad1f13225f06fe666036390defeff6652b39d0d656225376"
          )
          EXPECTED_ALPHA0_CURRENT_FILE_SHA256 = (
              "d939cd67e247b4f25c254cbec515b9f15e2e1d6efd2b9c87f023a86d5b249e13"
          )
          EXPECTED_ALPHA0_CURRENT_BYTE_LENGTH = 23942

          # --- F1C dual-bundle substrate (evidence only) ---
          first_bundle = certified_bundle_bytes(build_default_certified_bundle())
          second_bundle = certified_bundle_bytes(build_default_certified_bundle())
          if first_bundle != second_bundle:
              raise SystemExit("GV-FS0 F1C bundle is not byte deterministic")
          tracked_bundle = Path("data/gv_fs0/gv_fs0_certified_bundle.json").read_bytes()
          if tracked_bundle != first_bundle:
              raise SystemExit("tracked F1C bundle differs from current canonical build")
          bundle = build_default_certified_bundle()

          # --- E0A rebuild determinism (historical substrate only) ---
          e0a_first = certified_decision_result_bytes(build_e0a_certified_result())
          e0a_second = certified_decision_result_bytes(build_e0a_certified_result())
          if e0a_first != e0a_second:
              raise SystemExit("E0A current decision is not byte deterministic")
          if len(e0a_first) != EXPECTED_E0A_CURRENT_BYTE_LENGTH:
              raise SystemExit("E0A rebuild length mismatch")
          if sha256_bytes(e0a_first) != EXPECTED_E0A_CURRENT_FILE_SHA256:
              raise SystemExit("E0A rebuild file SHA-256 mismatch")
          research = build_e0a_research_decision()
          if research["research_decision_hash"] != EXPECTED_RESEARCH_DECISION_HASH:
              raise SystemExit("research_decision_hash mismatch")
          if research["rationale_ref"] != EXPECTED_E0A_RATIONALE_REF:
              raise SystemExit("E0A rationale_ref mismatch")
          e0a_parsed = parse_current_decision_bytes(e0a_first)
          if e0a_parsed["certified_decision_result_hash"] != EXPECTED_E0A_RESULT_HASH:
              raise SystemExit("E0A certified_decision_result_hash mismatch")

          # --- Tracked Alpha0 current decision (default product authority) ---
          tracked_current = Path("data/gv_fs0/gv_fs0_current_decision.json").read_bytes()
          if len(tracked_current) != EXPECTED_ALPHA0_CURRENT_BYTE_LENGTH:
              raise SystemExit(
                  f"Alpha0 current decision length {len(tracked_current)} != "
                  f"{EXPECTED_ALPHA0_CURRENT_BYTE_LENGTH}"
              )
          if sha256_bytes(tracked_current) != EXPECTED_ALPHA0_CURRENT_FILE_SHA256:
              raise SystemExit("Alpha0 current decision file SHA-256 mismatch")
          if tracked_current == e0a_first:
              raise SystemExit("tracked current must be Alpha0 authority, not E0A rebuild")
          alpha = parse_current_decision_bytes(tracked_current)
          if alpha["decision"]["decision_id"] != EXPECTED_ALPHA0_DECISION_ID:
              raise SystemExit("Alpha0 decision_id mismatch")
          if alpha["decision"]["action"] != "NO_POSITION":
              raise SystemExit("current decision action must be NO_POSITION")
          if alpha["decision"]["rationale_ref"] != EXPECTED_ALPHA0_RATIONALE_REF:
              raise SystemExit("Alpha0 rationale_ref must bind close case_claim hash")
          if alpha["certified_decision_result_hash"] != EXPECTED_ALPHA0_RESULT_HASH:
              raise SystemExit("Alpha0 certified_decision_result_hash mismatch")
          if alpha["certification"]["certification_status"] != "CERTIFIED":
              raise SystemExit("Alpha0 certification_status must be CERTIFIED")
          if alpha["role"] != "NO_POSITION":
              raise SystemExit("Alpha0 role must be NO_POSITION")

          record = {
              "f1c_substrate": {
                  "bundle_hash": bundle["bundle_hash"],
                  "bundle_id": bundle["bundle_id"],
                  "byte_length": len(first_bundle),
                  "file_sha256": sha256_bytes(first_bundle),
              },
              "e0a_substrate_rebuild": {
                  "research_decision_hash": EXPECTED_RESEARCH_DECISION_HASH,
                  "certified_decision_result_hash": EXPECTED_E0A_RESULT_HASH,
                  "rationale_ref": EXPECTED_E0A_RATIONALE_REF,
                  "byte_length": len(e0a_first),
                  "file_sha256": EXPECTED_E0A_CURRENT_FILE_SHA256,
                  "role": "NO_POSITION",
                  "decision_id": e0a_parsed["decision"]["decision_id"],
              },
              "alpha0_current_decision": {
                  "decision_id": EXPECTED_ALPHA0_DECISION_ID,
                  "case_claim_hash": EXPECTED_ALPHA0_CASE_CLAIM_HASH,
                  "certified_decision_result_hash": EXPECTED_ALPHA0_RESULT_HASH,
                  "rationale_ref": EXPECTED_ALPHA0_RATIONALE_REF,
                  "byte_length": len(tracked_current),
                  "file_sha256": EXPECTED_ALPHA0_CURRENT_FILE_SHA256,
                  "role": "NO_POSITION",
                  "certification_status": "CERTIFIED",
                  "claim_outcome": "CLAIM_INSUFFICIENT",
                  "research_action": "HOLD_FOR_EVIDENCE",
              },
          }
          Path("gv-fs0-product-parity.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Upload product parity record
        uses: actions/upload-artifact@v4
        with:
          name: gv-fs0-product-parity-${{ runner.os }}
          path: gv-fs0-product-parity.json
          if-no-files-found: error
          retention-days: 30

  byte-parity:
    name: Product Windows/Linux byte parity
    runs-on: ubuntu-latest
    needs: product-proof

    steps:
      - name: Download product parity records
        uses: actions/download-artifact@v4
        with:
          pattern: gv-fs0-product-parity-*
          merge-multiple: false

      - name: Download GV-ALPHA0 release candidates
        uses: actions/download-artifact@v4
        with:
          pattern: gv-alpha0-release-*
          merge-multiple: false

      - name: Compare exact parity records and release archives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          records = sorted(Path(".").glob("gv-fs0-product-parity-*/gv-fs0-product-parity.json"))
          if len(records) != 2:
              raise SystemExit(f"expected two parity records, found {len(records)}")
          payloads = [path.read_bytes() for path in records]
          if payloads[0] != payloads[1]:
              raise SystemExit("GV-FS0 product Windows/Linux parity differs")
          text = payloads[0].decode("utf-8")
          if "alpha0_current_decision" not in text:
              raise SystemExit("parity record missing alpha0_current_decision authority")
          if "e0a_substrate_rebuild" not in text:
              raise SystemExit("parity record missing e0a_substrate_rebuild")
          if "DECISION_V2_ALPHA0_CLOSE_MU_G_SUPPLY_1" not in text:
              raise SystemExit("parity record missing Alpha0 decision id")
          if "889cc831fe405e5aad1f13225f06fe666036390defeff6652b39d0d656225376" not in text:
              raise SystemExit("parity record missing Alpha0 certified result hash")
          if "d939cd67e247b4f25c254cbec515b9f15e2e1d6efd2b9c87f023a86d5b249e13" not in text:
              raise SystemExit("parity record missing Alpha0 current file SHA-256")
          if "627c136926ecf947f2ea00f24de85291d44ef5594016f022fac7f2217093d6e6" not in text:
              raise SystemExit("parity record missing fixed E0A substrate result hash")

          archives = sorted(
              Path(".").glob(
                  "gv-alpha0-release-*/gv-alpha0-paper-decision-*.zip"
              )
          )
          if len(archives) != 2:
              raise SystemExit(f"expected two release archives, found {len(archives)}")
          archive_payloads = [path.read_bytes() for path in archives]
          if archive_payloads[0] != archive_payloads[1]:
              raise SystemExit("GV-ALPHA0 Windows/Linux release archive differs")

          release_records = sorted(
              Path(".").glob(
                  "gv-alpha0-release-*/gv-alpha0-paper-decision-*.release.json"
              )
          )
          if len(release_records) != 2:
              raise SystemExit(
                  f"expected two release records, found {len(release_records)}"
              )
          if release_records[0].read_bytes() != release_records[1].read_bytes():
              raise SystemExit("GV-ALPHA0 Windows/Linux release record differs")
          print(text.strip())
          print(release_records[0].read_text(encoding="utf-8").strip())
          PY
