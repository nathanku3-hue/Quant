name: GV-FS0 Product

on:
  pull_request:
    paths:
      - "core/gv_fs0_book.py"
      - "core/gv_fs0_bundle.py"
      - "core/gv_fs0_canonical.py"
      - "core/gv_fs0_certify.py"
      - "core/gv_fs0_current_decision.py"
      - "core/gv_fs0_publish.py"
      - "core/gv_e0a_operable.py"
      - "core/gv_e0b_dv1_contradiction.py"
      - "data/gv_fs0/gv_fs0_certified_bundle.json"
      - "data/gv_fs0/gv_fs0_current_decision.json"
      - "data/gv_e0b/**"
      - "docs/architecture/godview_e0/**"
      - "scripts/publish_gv_e0a_current.py"
      - "views/gv_fs0_portfolio_adapter.py"
      - "views/page_registry.py"
      - "dashboard.py"
      - "tests/gv_fs0_product/**"
      - "tests/test_gv_fs0_*.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - ".github/workflows/gv-fs0-product.yml"
  push:
    paths:
      - "core/gv_fs0_book.py"
      - "core/gv_fs0_bundle.py"
      - "core/gv_fs0_canonical.py"
      - "core/gv_fs0_certify.py"
      - "core/gv_fs0_current_decision.py"
      - "core/gv_fs0_publish.py"
      - "core/gv_e0a_operable.py"
      - "core/gv_e0b_dv1_contradiction.py"
      - "data/gv_fs0/gv_fs0_certified_bundle.json"
      - "data/gv_fs0/gv_fs0_current_decision.json"
      - "data/gv_e0b/**"
      - "docs/architecture/godview_e0/**"
      - "scripts/publish_gv_e0a_current.py"
      - "views/gv_fs0_portfolio_adapter.py"
      - "views/page_registry.py"
      - "dashboard.py"
      - "tests/gv_fs0_product/**"
      - "tests/test_gv_fs0_*.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - ".github/workflows/gv-fs0-product.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-proof:
    name: Product proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install product test dependencies
        # filelock is a direct pin in requirements.txt / pyproject.toml (dashboard import).
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt

      - name: Emit environment custody evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git_text(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          freeze = subprocess.check_output(
              [sys.executable, "-m", "pip", "freeze"], text=True
          )
          filelock_ver = "ABSENT"
          for line in freeze.splitlines():
              if line.lower().startswith("filelock=="):
                  filelock_ver = line.split("==", 1)[1].strip()
                  break

          prereg = Path("docs/phase_brief/gv-e0b-dv1-contradiction-brief.md")
          manifest = Path("docs/candidate_manifests/gv_e0b_dv1_c1_candidate.json")
          record = {
              "runner_os": platform.platform(),
              "runner_image_name": os.environ.get("ImageOS", "unknown"),
              "runner_image_version": os.environ.get("ImageVersion", "unknown"),
              "python_version": sys.version.replace("\n", " "),
              "pip_version": subprocess.check_output(
                  [sys.executable, "-m", "pip", "--version"], text=True
              ).strip(),
              "pip_freeze": freeze.splitlines(),
              "filelock_version": filelock_ver,
              "candidate_commit": git_text("rev-parse", "HEAD"),
              "candidate_tree": git_text("rev-parse", "HEAD^{tree}"),
              "preregistration_sha256": (
                  sha256_file(prereg) if prereg.is_file() else None
              ),
              "candidate_manifest_sha256": (
                  sha256_file(manifest) if manifest.is_file() else None
              ),
          }
          Path("gv-fs0-environment-custody.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(json.dumps({k: record[k] for k in (
              "runner_os", "runner_image_name", "runner_image_version",
              "python_version", "filelock_version", "candidate_commit",
              "candidate_tree"
          )}, indent=2))
          PY

      - name: Upload environment custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: gv-fs0-environment-custody-${{ runner.os }}
          path: gv-fs0-environment-custody.json
          if-no-files-found: error
          retention-days: 30

      - name: Run product suite, frozen protocol, and E0A dashboard AppTests
        shell: bash
        run: >-
          python -c "import glob, pytest, sys;
          sys.exit(pytest.main([
            '-q',
            'tests/gv_fs0_product',
            *glob.glob('tests/test_gv_fs0_*.py'),
            'tests/test_dash_1_page_registry_shell.py::test_dash_1_default_portfolio_route_renders_current_decision',
          ]))"

      - name: Build F1C substrate + G08 current authority parity artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from core.gv_e0a_operable import (
              build_e0a_certified_result,
              build_e0a_research_decision,
          )
          from core.gv_fs0_bundle import certified_bundle_bytes
          from core.gv_fs0_canonical import sha256_bytes
          from core.gv_fs0_current_decision import (
              certified_decision_result_bytes,
              parse_current_decision_bytes,
          )
          from core.gv_fs0_publish import build_default_certified_bundle

          # E0A rebuild remains deterministic substrate (not tracked current after G08).
          EXPECTED_RESEARCH_DECISION_HASH = (
              "b4694a69bd1bc35a0d97a839ad47b66b517da1bd0f4abccd56bacca22d9e8e38"
          )
          EXPECTED_E0A_RESULT_HASH = (
              "627c136926ecf947f2ea00f24de85291d44ef5594016f022fac7f2217093d6e6"
          )
          EXPECTED_E0A_CURRENT_FILE_SHA256 = (
              "7ba9c7c48dfc89ceae2a5a88aba8bfebbe6d5032272b0d254f4139478699b5c9"
          )
          EXPECTED_E0A_CURRENT_BYTE_LENGTH = 23696
          EXPECTED_E0A_RATIONALE_REF = f"E0A:RD:{EXPECTED_RESEARCH_DECISION_HASH}"

          # Tracked product authority after G08 Attempt-1 publish.
          EXPECTED_G08_DECISION_ID = "DECISION_E0B_DV1_G08_1"
          EXPECTED_G08_COMPARISON_HASH = (
              "4524a358ba46a3029627d09729eacfe515f4f501e6bb4b9d0ea82685dd2bac37"
          )
          EXPECTED_G08_RATIONALE_REF = f"E0B:CMP:{EXPECTED_G08_COMPARISON_HASH}"
          EXPECTED_G08_RESULT_HASH = (
              "0321f1bc926c790da48a5ff453c52eec0ed7454302840d0e3c146103ea09c5a2"
          )
          EXPECTED_G08_CURRENT_FILE_SHA256 = (
              "2089697e82d9343846c3a57697997c5051c944b7cf404d76d2f5927fe65ea6fa"
          )
          EXPECTED_G08_CURRENT_BYTE_LENGTH = 23498

          # --- F1C dual-bundle substrate (evidence only) ---
          first_bundle = certified_bundle_bytes(build_default_certified_bundle())
          second_bundle = certified_bundle_bytes(build_default_certified_bundle())
          if first_bundle != second_bundle:
              raise SystemExit("GV-FS0 F1C bundle is not byte deterministic")
          tracked_bundle = Path("data/gv_fs0/gv_fs0_certified_bundle.json").read_bytes()
          if tracked_bundle != first_bundle:
              raise SystemExit("tracked F1C bundle differs from current canonical build")
          bundle = build_default_certified_bundle()

          # --- E0A rebuild determinism (substrate only) ---
          e0a_first = certified_decision_result_bytes(build_e0a_certified_result())
          e0a_second = certified_decision_result_bytes(build_e0a_certified_result())
          if e0a_first != e0a_second:
              raise SystemExit("E0A current decision is not byte deterministic")
          if len(e0a_first) != EXPECTED_E0A_CURRENT_BYTE_LENGTH:
              raise SystemExit("E0A rebuild length mismatch")
          if sha256_bytes(e0a_first) != EXPECTED_E0A_CURRENT_FILE_SHA256:
              raise SystemExit("E0A rebuild file SHA-256 mismatch")
          research = build_e0a_research_decision()
          if research["research_decision_hash"] != EXPECTED_RESEARCH_DECISION_HASH:
              raise SystemExit("research_decision_hash mismatch")
          if research["rationale_ref"] != EXPECTED_E0A_RATIONALE_REF:
              raise SystemExit("E0A rationale_ref mismatch")
          e0a_parsed = parse_current_decision_bytes(e0a_first)
          if e0a_parsed["certified_decision_result_hash"] != EXPECTED_E0A_RESULT_HASH:
              raise SystemExit("E0A certified_decision_result_hash mismatch")

          # --- Tracked G08 current decision (default product authority) ---
          tracked_current = Path("data/gv_fs0/gv_fs0_current_decision.json").read_bytes()
          if len(tracked_current) != EXPECTED_G08_CURRENT_BYTE_LENGTH:
              raise SystemExit(
                  f"G08 current decision length {len(tracked_current)} != "
                  f"{EXPECTED_G08_CURRENT_BYTE_LENGTH}"
              )
          if sha256_bytes(tracked_current) != EXPECTED_G08_CURRENT_FILE_SHA256:
              raise SystemExit("G08 current decision file SHA-256 mismatch")
          if tracked_current == e0a_first:
              raise SystemExit("tracked current must be G08 authority, not E0A rebuild")
          g08_parsed = parse_current_decision_bytes(tracked_current)
          if g08_parsed["decision"]["decision_id"] != EXPECTED_G08_DECISION_ID:
              raise SystemExit("G08 decision_id mismatch")
          if g08_parsed["decision"]["action"] != "NO_POSITION":
              raise SystemExit("current decision action must be NO_POSITION")
          if g08_parsed["decision"]["rationale_ref"] != EXPECTED_G08_RATIONALE_REF:
              raise SystemExit("G08 rationale_ref must bind E0B:CMP comparison hash")
          if g08_parsed["certified_decision_result_hash"] != EXPECTED_G08_RESULT_HASH:
              raise SystemExit("G08 certified_decision_result_hash mismatch")
          if g08_parsed["certification"]["certification_status"] != "CERTIFIED":
              raise SystemExit("G08 certification_status must be CERTIFIED")

          record = {
              "f1c_substrate": {
                  "bundle_hash": bundle["bundle_hash"],
                  "bundle_id": bundle["bundle_id"],
                  "byte_length": len(first_bundle),
                  "file_sha256": sha256_bytes(first_bundle),
              },
              "e0a_substrate_rebuild": {
                  "research_decision_hash": EXPECTED_RESEARCH_DECISION_HASH,
                  "certified_decision_result_hash": EXPECTED_E0A_RESULT_HASH,
                  "rationale_ref": EXPECTED_E0A_RATIONALE_REF,
                  "byte_length": len(e0a_first),
                  "file_sha256": EXPECTED_E0A_CURRENT_FILE_SHA256,
                  "role": "NO_POSITION",
                  "decision_id": e0a_parsed["decision"]["decision_id"],
              },
              "g08_current_decision": {
                  "decision_id": EXPECTED_G08_DECISION_ID,
                  "comparison_hash": EXPECTED_G08_COMPARISON_HASH,
                  "certified_decision_result_hash": EXPECTED_G08_RESULT_HASH,
                  "rationale_ref": EXPECTED_G08_RATIONALE_REF,
                  "byte_length": len(tracked_current),
                  "file_sha256": EXPECTED_G08_CURRENT_FILE_SHA256,
                  "role": "NO_POSITION",
                  "value_disposition": "IMPROVED",
              },
          }
          Path("gv-fs0-product-parity.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Upload product parity record
        uses: actions/upload-artifact@v4
        with:
          name: gv-fs0-product-parity-${{ runner.os }}
          path: gv-fs0-product-parity.json
          if-no-files-found: error
          retention-days: 30

  byte-parity:
    name: Product Windows/Linux byte parity
    runs-on: ubuntu-latest
    needs: product-proof

    steps:
      - name: Download product parity records
        uses: actions/download-artifact@v4
        with:
          pattern: gv-fs0-product-parity-*
          merge-multiple: false

      - name: Compare exact parity records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          records = sorted(Path(".").glob("gv-fs0-product-parity-*/gv-fs0-product-parity.json"))
          if len(records) != 2:
              raise SystemExit(f"expected two parity records, found {len(records)}")
          payloads = [path.read_bytes() for path in records]
          if payloads[0] != payloads[1]:
              raise SystemExit("GV-FS0 product Windows/Linux parity differs")
          text = payloads[0].decode("utf-8")
          if "g08_current_decision" not in text:
              raise SystemExit("parity record missing g08_current_decision authority")
          if "e0a_substrate_rebuild" not in text:
              raise SystemExit("parity record missing e0a_substrate_rebuild")
          if "4524a358ba46a3029627d09729eacfe515f4f501e6bb4b9d0ea82685dd2bac37" not in text:
              raise SystemExit("parity record missing G08 comparison hash")
          if "0321f1bc926c790da48a5ff453c52eec0ed7454302840d0e3c146103ea09c5a2" not in text:
              raise SystemExit("parity record missing G08 certified result hash")
          if "627c136926ecf947f2ea00f24de85291d44ef5594016f022fac7f2217093d6e6" not in text:
              raise SystemExit("parity record missing fixed E0A substrate result hash")
          print(text.strip())
          PY
