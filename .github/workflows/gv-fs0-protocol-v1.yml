name: GV-FS0 Protocol V1

on:
  pull_request:
    paths:
      - "docs/architecture/gv_fs0_certification_and_data_authority_contract.md"
      - "docs/phase_brief/phase-E0-brief.md"
      - "docs/context/e2e_evidence/gv_fs0_protocol_v1/**"
      - "gv_fs0/protocol/**"
      - "schemas/gv_fs0/v1/**"
      - "validation/gv_fs0_*.py"
      - "tests/test_gv_fs0_protocol_*.py"
      - ".github/workflows/gv-fs0-protocol-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/architecture/gv_fs0_certification_and_data_authority_contract.md"
      - "docs/phase_brief/phase-E0-brief.md"
      - "docs/context/e2e_evidence/gv_fs0_protocol_v1/**"
      - "gv_fs0/protocol/**"
      - "schemas/gv_fs0/v1/**"
      - "validation/gv_fs0_*.py"
      - "tests/test_gv_fs0_protocol_*.py"
      - ".github/workflows/gv-fs0-protocol-v1.yml"

permissions:
  contents: read

jobs:
  protocol-proof:
    name: Protocol proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout without submodule recursion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --no-recurse-submodules --prune --no-tags origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+${GITHUB_SHA}:refs/remotes/pull/${{ github.event.pull_request.number || 0 }}/merge"
          git checkout --force "${GITHUB_SHA}"
          git config --local gc.auto 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install protocol-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.2 jsonschema==4.26.0

      - name: Validate generated artifacts and freeze hashes
        run: python validation/gv_fs0_protocol_freeze.py

      - name: Enforce same-version immutability
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF}" ]] && git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            python validation/gv_fs0_v1_immutability.py --base-ref "${BASE_REF}"
          else
            python validation/gv_fs0_v1_immutability.py
          fi

      - name: Run bounded protocol and golden suite
        run: >-
          python -m pytest -q
          tests/test_gv_fs0_protocol_canonical.py
          tests/test_gv_fs0_protocol_schemas.py
          tests/test_gv_fs0_protocol_ordering_publication.py
          tests/test_gv_fs0_protocol_supervision.py
          tests/test_gv_fs0_protocol_freeze.py
