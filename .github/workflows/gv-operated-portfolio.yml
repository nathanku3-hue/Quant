name: GodView AOV Product Proof

on:
  pull_request:
    paths:
      - ".github/workflows/gv-operated-portfolio.yml"
      - "dashboard.py"
      - "launch.py"
      - "research/**"
      - "scripts/aov_zero_compat_scan.py"
      - "release/gv-alpha0/**"
      - "gv_portfolio_v0/**"
      - "views/command_center.py"
      - "views/page_registry.py"
      - "data/gv_pair_decision_series/**"
      - "tests/aov0/**"
      - "tests/test_research_*.py"
      - "tests/test_gv_*.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - "tests/gv_fs0_product/test_gv_alpha0_historical_receipt.py"
      - "docs/context/**"
      - "docs/architecture/**"
      - "docs/phase_brief/alpha-organism-vertical-0-brief.md"
      - "PHASE_QUEUE.md"
      - "README.md"
      - "PRD.md"
      - "PRODUCT_SPEC.md"
  push:
    branches:
      - "codex/pit-source-authority-1"
    paths:
      - ".github/workflows/gv-operated-portfolio.yml"
      - "dashboard.py"
      - "launch.py"
      - "research/**"
      - "scripts/aov_zero_compat_scan.py"
      - "release/gv-alpha0/**"
      - "gv_portfolio_v0/**"
      - "views/command_center.py"
      - "views/page_registry.py"
      - "data/gv_pair_decision_series/**"
      - "tests/aov0/**"
      - "tests/test_research_*.py"
      - "tests/test_gv_*.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - "tests/gv_fs0_product/test_gv_alpha0_historical_receipt.py"
      - "docs/context/**"
      - "docs/architecture/**"
      - "docs/phase_brief/alpha-organism-vertical-0-brief.md"
      - "PHASE_QUEUE.md"
      - "README.md"
      - "PRD.md"
      - "PRODUCT_SPEC.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aov-proof:
    name: AOV proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact clean candidate and hard cut
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e alpha_app.py
          test ! -e launch_alpha.py
          test ! -e portfolio_app.py
          test ! -e launch_portfolio.py
          test ! -e scripts/build_gv_alpha0_release.py
          test ! -e scripts/smoke_gv_alpha0_release.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify dependency surface
        run: python -m pip check

      - name: Zero-compat AOV scan
        run: python scripts/aov_zero_compat_scan.py

      - name: Run AOV and hardened research proof
        run: >-
          python -m pytest -q
          tests/aov0
          tests/test_research_backtest_runner.py
          tests/test_research_benchmarks.py
          tests/test_research_evidence_schema.py
          tests/test_research_rule100_adapter.py
          tests/test_dash_1_page_registry_shell.py
          tests/gv_fs0_product/test_gv_alpha0_historical_receipt.py

      - name: Run Episode-2 custody regression
        run: >-
          python -m pytest -q
          tests/test_gv_immutable_market_packet.py
          tests/test_gv_pit_transaction.py
          tests/test_gv_pit_operated_capital.py
          tests/test_gv_pit_operated_rotation.py
          tests/gv_portfolio_v0/test_operated.py
          tests/gv_portfolio_v0/test_operated_25.py
          tests/gv_portfolio_v0/test_prospective.py
          tests/gv_portfolio_v0/test_real_evidence_mu.py
          tests/gv_portfolio_v0/test_same_evidence_shadow.py

      - name: Validate current context
        run: python scripts/build_context_packet.py --validate

      - name: Require tests to leave tracked bytes unchanged
        run: git diff --exit-code
