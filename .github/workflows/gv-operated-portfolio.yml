name: GodView PIT Product Proof

on:
  pull_request:
    paths:
      - ".github/workflows/gv-operated-portfolio.yml"
      - ".github/workflows/gv-fs0-product.yml"
      - "dashboard.py"
      - "core/gv_pit/**"
      - "core/gv_v2_mu_nvda_*.py"
      - "data/gv_v2_reconciliation/**"
      - "data/gv_pair_decision_series/**"
      - "gv_portfolio_v0/**"
      - "views/command_center.py"
      - "views/page_registry.py"
      - "tests/test_gv_pit_*.py"
      - "tests/test_gv_immutable_market_packet.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - "tests/gv_portfolio_v0/test_operated*.py"
      - "tests/gv_portfolio_v0/test_prospective.py"
      - "tests/gv_portfolio_v0/test_real_evidence_mu.py"
      - "tests/gv_portfolio_v0/test_same_evidence_shadow.py"
      - "docs/context/**"
      - "docs/architecture/top_level_roadmap.md"
      - "README.md"
      - "PHASE_QUEUE.md"
      - "PRD.md"
      - "PRODUCT_SPEC.md"
  push:
    branches:
      - "codex/pit-source-authority-1"
    paths:
      - ".github/workflows/gv-operated-portfolio.yml"
      - ".github/workflows/gv-fs0-product.yml"
      - "dashboard.py"
      - "core/gv_pit/**"
      - "core/gv_v2_mu_nvda_*.py"
      - "data/gv_v2_reconciliation/**"
      - "data/gv_pair_decision_series/**"
      - "gv_portfolio_v0/**"
      - "views/command_center.py"
      - "views/page_registry.py"
      - "tests/test_gv_pit_*.py"
      - "tests/test_gv_immutable_market_packet.py"
      - "tests/test_dash_1_page_registry_shell.py"
      - "tests/gv_portfolio_v0/test_operated*.py"
      - "tests/gv_portfolio_v0/test_prospective.py"
      - "tests/gv_portfolio_v0/test_real_evidence_mu.py"
      - "tests/gv_portfolio_v0/test_same_evidence_shadow.py"
      - "docs/context/**"
      - "docs/architecture/top_level_roadmap.md"
      - "README.md"
      - "PHASE_QUEUE.md"
      - "PRD.md"
      - "PRODUCT_SPEC.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit-product-proof:
    name: PIT product proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact clean candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e operated_portfolio_app.py
          test ! -e launch_operated_portfolio.py
          test ! -e launch_operated_portfolio_25.py
          test ! -e views/gv_prospective_paper_workspace.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify dependency surface
        run: python -m pip check

      - name: Run PIT domain and Command Center product proof
        run: >-
          python -m pytest -q
          tests/test_gv_immutable_market_packet.py
          tests/test_gv_pit_transaction.py
          tests/test_gv_pit_operated_capital.py
          tests/test_gv_pit_operated_rotation.py
          tests/test_dash_1_page_registry_shell.py
          tests/gv_portfolio_v0/test_operated.py
          tests/gv_portfolio_v0/test_operated_25.py
          tests/gv_portfolio_v0/test_prospective.py
          tests/gv_portfolio_v0/test_real_evidence_mu.py
          tests/gv_portfolio_v0/test_same_evidence_shadow.py

      - name: Validate generated current context
        run: python scripts/build_context_packet.py --validate

      - name: Require tests to leave tracked bytes unchanged
        run: git diff --exit-code
